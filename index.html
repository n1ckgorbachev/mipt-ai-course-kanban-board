<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инго Экосистема</title>
    <link rel="stylesheet" href="style.css?v=20260611-ingo">
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <p class="brand__eyebrow">Проектный контур</p>
            <h1>Инго Экосистема</h1>
            <p>Канбан-доска для продуктовых и сервисных задач экосистемы.</p>
          </div>
        </div>

        <form class="project-form" id="project-form">
          <label class="field">
            <span>Название проекта</span>
            <input id="project-title" name="title" type="text" placeholder="Например, Лендинг" required>
          </label>
          <button type="submit">Добавить проект</button>
        </form>
      </header>

      <section class="projects" id="projects" aria-label="Проекты"></section>
    </main>

    <template id="project-template">
      <article class="project">
        <header class="project__header">
          <button class="project__toggle" type="button" aria-expanded="true">
            <span class="project__icon" aria-hidden="true"></span>
            <span class="project__title"></span>
          </button>
          <button class="project__delete" type="button">Удалить</button>
        </header>
        <div class="project__content">
          <form class="column-form">
            <label class="field">
              <span>Название столбца</span>
              <input name="title" type="text" placeholder="Например, В работе" required>
            </label>
            <label class="field field--color">
              <span>Цвет</span>
              <input name="color" type="color" value="#dbeafe">
            </label>
            <button type="submit">Добавить столбец</button>
          </form>
          <section class="board" aria-label="Канбан доска проекта"></section>
        </div>
      </article>
    </template>

    <template id="column-template">
      <article class="column">
        <header class="column__header">
          <div class="column__accent"></div>
          <div>
            <h2></h2>
            <span class="column__count"></span>
          </div>
        </header>
        <form class="card-form">
          <input name="card" type="text" placeholder="Новая карточка" required>
          <button type="submit">Добавить</button>
        </form>
        <div class="card-list"></div>
      </article>
    </template>

    <script>
      const STORAGE_KEY = "kanban-board-state";
      const DEFAULT_PROJECT_TITLE = "Основной проект";
      const DEFAULT_COLUMNS = [
        { id: "todo", title: "К выполнению", color: "#dff4ff", cards: [
          { id: "task-1", title: "Собрать требования" },
          { id: "task-2", title: "Оценить задачи" }
        ] },
        { id: "progress", title: "В работе", color: "#e7f7ef", cards: [
          { id: "task-3", title: "Сверстать интерфейс" }
        ] },
        { id: "done", title: "Готово", color: "#e8eaff", cards: [] }
      ];
      const DEFAULT_PROJECTS = [
        { id: "project-main", title: DEFAULT_PROJECT_TITLE, collapsed: false, columns: DEFAULT_COLUMNS }
      ];

      const projectsContainer = document.querySelector("#projects");
      const projectForm = document.querySelector("#project-form");
      const projectTitle = document.querySelector("#project-title");
      const projectTemplate = document.querySelector("#project-template");
      const columnTemplate = document.querySelector("#column-template");

      let state = loadState();
      let draggedCard = null;

      function loadState() {
        const savedState = localStorage.getItem(STORAGE_KEY);

        if (!savedState) {
          return structuredClone(DEFAULT_PROJECTS);
        }

        try {
          const parsedState = JSON.parse(savedState);

          if (!Array.isArray(parsedState)) {
            return structuredClone(DEFAULT_PROJECTS);
          }

          if (parsedState.every((item) => Array.isArray(item.columns))) {
            return parsedState;
          }

          return [{
            id: "project-main",
            title: DEFAULT_PROJECT_TITLE,
            collapsed: false,
            columns: parsedState
          }];
        } catch {
          return structuredClone(DEFAULT_PROJECTS);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function createId(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function getProject(projectId) {
        return state.find((project) => project.id === projectId);
      }

      function getColumn(projectId, columnId) {
        const project = getProject(projectId);
        return project?.columns.find((column) => column.id === columnId);
      }

      function getCardLocation(cardId) {
        for (const project of state) {
          for (const column of project.columns) {
            const cardIndex = column.cards.findIndex((card) => card.id === cardId);

            if (cardIndex !== -1) {
              return { project, column, cardIndex };
            }
          }
        }

        return null;
      }

      function moveCard(cardId, targetProjectId, targetColumnId) {
        const source = getCardLocation(cardId);
        const targetColumn = getColumn(targetProjectId, targetColumnId);

        if (!source || !targetColumn || source.project.id !== targetProjectId) {
          return;
        }

        const [card] = source.column.cards.splice(source.cardIndex, 1);
        targetColumn.cards.push(card);
        saveState();
        renderProjects();
      }

      function renderProjects() {
        projectsContainer.replaceChildren();

        if (state.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "projects__empty";
          emptyMessage.textContent = "Добавьте первый проект.";
          projectsContainer.append(emptyMessage);
          return;
        }

        state.forEach((project) => {
          projectsContainer.append(createProjectNode(project));
        });
      }

      function createProjectNode(project) {
        const projectNode = projectTemplate.content.firstElementChild.cloneNode(true);
        const toggleButton = projectNode.querySelector(".project__toggle");
        const deleteButton = projectNode.querySelector(".project__delete");
        const title = projectNode.querySelector(".project__title");
        const content = projectNode.querySelector(".project__content");
        const columnForm = projectNode.querySelector(".column-form");
        const columnTitle = columnForm.querySelector('input[name="title"]');
        const columnColor = columnForm.querySelector('input[name="color"]');
        const board = projectNode.querySelector(".board");

        projectNode.dataset.projectId = project.id;
        projectNode.classList.toggle("project--collapsed", project.collapsed);
        title.textContent = project.title;
        content.hidden = project.collapsed;
        toggleButton.setAttribute("aria-expanded", String(!project.collapsed));

        toggleButton.addEventListener("click", () => {
          project.collapsed = !project.collapsed;
          saveState();
          renderProjects();
        });

        deleteButton.addEventListener("click", () => {
          const confirmed = confirm(`Удалить проект "${project.title}"?`);

          if (!confirmed) {
            return;
          }

          state = state.filter((item) => item.id !== project.id);
          saveState();
          renderProjects();
        });

        columnForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const columnName = columnTitle.value.trim();

          if (!columnName) {
            return;
          }

          project.columns.push({
            id: createId("column"),
            title: columnName,
            color: columnColor.value,
            cards: []
          });

          columnTitle.value = "";
          columnColor.value = "#dff4ff";
          saveState();
          renderProjects();
        });

        renderBoard(project, board);
        return projectNode;
      }

      function renderBoard(project, board) {
        board.replaceChildren();

        if (project.columns.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.className = "board__empty";
          emptyMessage.textContent = "Добавьте первый столбец.";
          board.append(emptyMessage);
          return;
        }

        project.columns.forEach((column) => {
          const columnNode = columnTemplate.content.firstElementChild.cloneNode(true);
          const title = columnNode.querySelector("h2");
          const count = columnNode.querySelector(".column__count");
          const accent = columnNode.querySelector(".column__accent");
          const cardForm = columnNode.querySelector(".card-form");
          const cardInput = cardForm.querySelector("input");
          const cardList = columnNode.querySelector(".card-list");

          columnNode.dataset.projectId = project.id;
          columnNode.dataset.columnId = column.id;
          title.textContent = column.title;
          count.textContent = `${column.cards.length} ${getTaskWord(column.cards.length)}`;
          accent.style.background = column.color;
          cardList.dataset.projectId = project.id;
          cardList.dataset.columnId = column.id;

          column.cards.forEach((card) => {
            cardList.append(createCardNode(card, column.color));
          });

          cardForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const cardTitle = cardInput.value.trim();

            if (!cardTitle) {
              return;
            }

            column.cards.push({ id: createId("card"), title: cardTitle });
            cardInput.value = "";
            saveState();
            renderProjects();
          });

          cardList.addEventListener("dragover", (event) => {
            event.preventDefault();
            cardList.classList.add("card-list--drag-over");
          });

          cardList.addEventListener("dragleave", () => {
            cardList.classList.remove("card-list--drag-over");
          });

          cardList.addEventListener("drop", (event) => {
            event.preventDefault();
            cardList.classList.remove("card-list--drag-over");
            const cardId = event.dataTransfer.getData("text/plain") || draggedCard;
            moveCard(cardId, project.id, column.id);
          });

          board.append(columnNode);
        });
      }

      function createCardNode(card, color) {
        const cardNode = document.createElement("article");
        cardNode.className = "card";
        cardNode.draggable = true;
        cardNode.dataset.cardId = card.id;
        cardNode.style.background = color;
        cardNode.textContent = card.title;

        cardNode.addEventListener("dragstart", (event) => {
          draggedCard = card.id;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", card.id);
          cardNode.classList.add("card--dragging");
        });

        cardNode.addEventListener("dragend", () => {
          draggedCard = null;
          cardNode.classList.remove("card--dragging");
        });

        return cardNode;
      }

      function getTaskWord(count) {
        const lastDigit = count % 10;
        const lastTwoDigits = count % 100;

        if (lastDigit === 1 && lastTwoDigits !== 11) {
          return "задача";
        }

        if ([2, 3, 4].includes(lastDigit) && ![12, 13, 14].includes(lastTwoDigits)) {
          return "задачи";
        }

        return "задач";
      }

      projectForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = projectTitle.value.trim();

        if (!title) {
          return;
        }

        state.push({
          id: createId("project"),
          title,
          collapsed: false,
          columns: []
        });

        projectTitle.value = "";
        saveState();
        renderProjects();
      });

      renderProjects();
    </script>
  </body>
</html>
